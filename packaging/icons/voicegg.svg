<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer audio ring (glowing) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#waveGrad)" stroke-width="12" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#waveGrad)" stroke-width="8" opacity="0.5" />

  <!-- Equalizer / Waveform Bars -->
  <g fill="url(#waveGrad)" filter="url(#glow)">
    <!-- Left bars -->
    <rect x="136" y="200" width="16" height="112" rx="8" />
    <rect x="168" y="160" width="16" height="192" rx="8" />
    <rect x="200" y="220" width="16" height="72" rx="8" />

    <!-- Center dynamic bars -->
    <rect x="232" y="120" width="16" height="272" rx="8" />
    <rect x="264" y="140" width="16" height="232" rx="8" />

    <!-- Right bars -->
    <rect x="296" y="190" width="16" height="132" rx="8" />
    <rect x="328" y="150" width="16" height="212" rx="8" />
    <rect x="360" y="210" width="16" height="92" rx="8" />
  </g>

  <!-- Accent indicator dots -->
  <circle cx="256" cy="90" r="10" fill="#10b981" />
  <circle cx="256" cy="422" r="10" fill="#6366f1" />
</svg>
