[workspace]
resolver = "2"
members = [
    "crates/voicegg-core",
    "crates/voicegg-dsp",
    "crates/voicegg-pw",
    "crates/voicegg-ipc",
    "crates/voicegg-daemon",
    "crates/voicegg-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VoiceGG Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/voicegg/voicegg"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
voicegg-core = { path = "crates/voicegg-core" }
voicegg-dsp = { path = "crates/voicegg-dsp" }
voicegg-pw = { path = "crates/voicegg-pw" }
voicegg-ipc = { path = "crates/voicegg-ipc" }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

# PipeWire & Audio
pipewire = "0.10"
nnnoiseless = "0.5"

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
