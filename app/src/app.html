<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoiceGG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg-app: #0B0E14;
        --color-surface-1: #11151F;
        --color-surface-2: #161B26;
        --color-surface-3: #1D2333;
        --color-surface-hover: #252D40;
        --color-border-subtle: #1C2230;
        --color-border-default: #262E40;
        --color-border-bright: #3B4660;
        
        --color-text-primary: #F8FAFC;
        --color-text-secondary: #94A3B8;
        --color-text-muted: #64748B;

        --color-accent-master: #E2E8F0;
        --color-accent-game: #10B981;
        --color-accent-chat: #0EA5E9;
        --color-accent-media: #EC4899;
        --color-accent-aux: #8B5CF6;
        --color-accent-mic: #F97316;
        --color-accent-danger: #EF4444;
        --color-accent-brand: #FF5200;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;

    %sveltekit.head%

  <body data-sveltekit-preload-data="hover">
